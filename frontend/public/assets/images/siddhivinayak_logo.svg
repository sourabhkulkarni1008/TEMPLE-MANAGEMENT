<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="50%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Sacred Medallion Circle -->
  <circle cx="50" cy="50" r="47" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="43" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2, 2.5" />

  <!-- Sacred Rays Aura (Sun/Divinity) -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.4">
    <line x1="50" y1="9" x2="50" y2="13" />
    <line x1="50" y1="87" x2="50" y2="91" />
    <line x1="9" y1="50" x2="13" y2="50" />
    <line x1="87" y1="50" x2="91" y2="50" />
    <line x1="21" y1="21" x2="24" y2="24" />
    <line x1="76" y1="76" x2="79" y2="79" />
    <line x1="21" y1="79" x2="24" y2="76" />
    <line x1="76" y1="24" x2="79" y2="21" />
  </g>

  <!-- Divine Halo Glow Behind Crown -->
  <ellipse cx="50" cy="34" rx="20" ry="16" fill="url(#haloGrad)" filter="url(#glow)" />

  <!-- Temple Mukut (Crown) -->
  <path d="M 38 32 L 50 16 L 62 32 L 57 32 L 50 24 L 43 32 Z" fill="url(#goldGrad)" />
  <circle cx="50" cy="15" r="2" fill="#fff" filter="url(#glow)" />
  <circle cx="50" cy="24" r="1.5" fill="#e11d48" />

  <!-- Sacred Tilak / Tripundra on Forehead -->
  <path d="M 44 34 Q 50 36 56 34" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M 45 36.5 Q 50 38.5 55 36.5" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M 48 31 Q 50 40 50 41 Q 50 40 52 31 Z" fill="#dc2626" />
  <circle cx="50" cy="38" r="1.2" fill="#facc15" />

  <!-- Ganesha Sacred Face & Right-Turning Trunk (Siddhivinayak Right-Side Trunk Speciality) -->
  <!-- Left Ear (Large Auspicious Shurpakarna) -->
  <path d="M 39 36 C 26 36, 24 50, 35 56 C 36 56, 38 52, 38 48 Z" fill="url(#goldGrad)" opacity="0.95" />
  <path d="M 36 40 C 29 42, 28 50, 35 53" fill="none" stroke="#7c2d12" stroke-width="1" />

  <!-- Right Ear -->
  <path d="M 61 36 C 74 36, 76 50, 65 56 C 64 56, 62 52, 62 48 Z" fill="url(#goldGrad)" opacity="0.95" />
  <path d="M 64 40 C 71 42, 72 50, 65 53" fill="none" stroke="#7c2d12" stroke-width="1" />

  <!-- Brow & Head Contour -->
  <path d="M 38 42 Q 50 46 62 42 C 60 52, 58 56, 50 56 C 42 56, 40 52, 38 42 Z" fill="url(#goldGrad)" />

  <!-- Auspicious Eyes -->
  <path d="M 41 42 Q 45 40 46 43" stroke="#451a03" stroke-width="1.2" fill="none" stroke-linecap="round" />
  <path d="M 59 42 Q 55 40 54 43" stroke="#451a03" stroke-width="1.2" fill="none" stroke-linecap="round" />

  <!-- Siddhivinayak Right-Turned Trunk (Valampuri Dakshinabhimukhi) -->
  <path d="M 47 48 C 47 58, 48 68, 52 73 C 55 77, 63 77, 66 73 C 69 69, 67 64, 62 64 C 58 64, 57 68, 60 70 C 62 71, 63 70, 63 68 C 63 66, 60 66, 59 68 C 56 72, 53 71, 51 66 C 49 61, 49 53, 53 48 Z" fill="url(#goldGrad)" />

  <!-- Single Auspicious Tusk (Ekadanta) -->
  <path d="M 43 51 L 39 53 L 43 55 Z" fill="#ffffff" />

  <!-- Sacred Modak Sweet in Trunk Tip -->
  <g transform="translate(63, 60)">
    <path d="M 0 4 Q 4 4 4 2 Q 4 -2 0 -4 Q -4 -2 -4 2 Q -4 4 0 4 Z" fill="#fef08a" stroke="#d97706" stroke-width="0.8" />
    <path d="M 0 -4 L 0 4 M -2 -1 L -2 3 M 2 -1 L 2 3" stroke="#d97706" stroke-width="0.5" />
  </g>

  <!-- Sacred Om/Lotus Base Ornament -->
  <path d="M 32 82 Q 50 76 68 82 Q 50 86 32 82 Z" fill="url(#goldGrad)" />
  <circle cx="50" cy="81" r="2.2" fill="#e11d48" />
  <circle cx="42" cy="81" r="1.5" fill="#facc15" />
  <circle cx="58" cy="81" r="1.5" fill="#facc15" />
</svg>
